# Partie 17 - Tache 75 : Dependabot (dependances vulnerables + PR automatiques)
version: 2
updates:
  # Dependances npm du frontend Next.js
  - package-ecosystem: npm
    directory: /portfolio-next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # Dependances npm de l'API Express
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # Actions GitHub utilisees dans les workflows (maintient les SHA a jour)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Images de base des Dockerfiles
  - package-ecosystem: docker
    directory: /portfolio-next
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
